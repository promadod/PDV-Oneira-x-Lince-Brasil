services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pdv}
      POSTGRES_USER: ${POSTGRES_USER:-pdv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pdv} -d ${POSTGRES_DB:-pdv}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
      # Sempre a rede Docker interna (não use 127.0.0.1 aqui — isso quebra no Contabo).
      ACBR_LIB_WORKER_URL: http://acbr-lib:8091
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      acbr-lib:
        condition: service_started
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  acbr-lib:
    build:
      context: .
      dockerfile: deploy/acbrlib/Dockerfile
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      OPENSSL_CONF: /opt/acbrlib/openssl-legacy.cnf
      ACBR_LIB_SO: /opt/acbrlib/Linux/CONSOLE-MT/libacbrnfe64.so
      ACBR_LIB_SCHEMAS: /opt/acbrlib/Schemas/NFe
      ACBR_LIB_SERVICOS: /opt/acbrlib/ACBrNFeServicos.ini
    volumes:
      - media_data:/media
    # Só localhost no host (debug). No Contabo a web fala via rede interna acbr-lib:8091.
    ports:
      - "127.0.0.1:${ACBR_LIB_PORT:-8091}:8091"
    expose:
      - "8091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8091/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/var/www/media:ro
      - static_data:/var/www/static:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
  static_data:
  certbot_www:
  certbot_certs:
