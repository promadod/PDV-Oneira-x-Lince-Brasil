# Produção Contabo — Postgres só na rede interna Docker.
# docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  web:
    environment:
      DEBUG: "False"
      # Em produção com HTTPS, defina no .env: SECURE_SSL_REDIRECT=True
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}

  nginx:
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
