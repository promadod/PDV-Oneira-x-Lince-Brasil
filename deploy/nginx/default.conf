upstream django {
    server web:8000;
}

# HTTP: desafio ACME + redireciona o resto para HTTPS
server {
    listen 80;
    server_name oneirasistemas.com.br www.oneirasistemas.com.br 207.244.248.73;

    client_max_body_size 25M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /health/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        return 301 https://oneirasistemas.com.br$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name oneirasistemas.com.br;

    ssl_certificate     /etc/letsencrypt/live/oneirasistemas.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oneirasistemas.com.br/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 25M;

    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /var/www/media/;
        access_log off;
        expires 7d;
    }

    location /health/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        access_log off;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
